name: Update Stats

on:
  schedule:
    - cron: "23 */12 * * *"
  workflow_dispatch:
  push:
    branches:
      - main
    # Only re-render when the generator or its config changes, not on every README edit
    paths:
      - .github/workflows/update-stats.yml
      - scripts/generate_stats.py

# Share one queue with the activity workflow so the two never push to main at the same time
concurrency:
  group: profile-readme-update
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  stats:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      # Renders github-metrics.svg and languages.svg; fails instead of drawing partial data
      - name: Generate stats cards
        env:
          # PAT with repo scope so private repos count toward totals (their names are never shown)
          GH_TOKEN: ${{ secrets.METRICS_TOKEN }}
        run: python3 scripts/generate_stats.py

      - name: Commit updated cards
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add github-metrics.svg languages.svg .github/stats/lines-cache.json
          if git diff --cached --quiet; then
            echo "Stats unchanged"
          else
            git commit -m "📊 Update stats cards"
            git pull --rebase origin main
            git push
          fi
