name: Update GitHub Activity

on:
  schedule:
    - cron: "17 */3 * * *"
  workflow_dispatch:

# Share one queue with the stats workflow so the two never push to main at the same time
concurrency:
  group: profile-readme-update
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    name: Update this repo's README with recent activity

    steps:
      - uses: actions/checkout@v5
      - uses: jamesgeorge007/github-activity-readme@v0.5.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          COMMIT_MSG: '⚡ Update activity feed in README.md'
          MAX_LINES: 5
