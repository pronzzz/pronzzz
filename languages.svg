<svg xmlns="http://www.w3.org/2000/svg" width="480" height="238" viewBox="0 0 480 238" role="img" aria-label="Most used languages">
  <style>
    .card { fill: #ffffff; stroke: #d0d7de; }
    .title { font: 600 17px 'Segoe UI', Ubuntu, Helvetica, Arial, sans-serif; fill: #2196F3; }
    .sub { font: 400 12px 'Segoe UI', Ubuntu, Helvetica, Arial, sans-serif; fill: #57606a; }
    .label { font: 400 13px 'Segoe UI', Ubuntu, Helvetica, Arial, sans-serif; fill: #57606a; }
    .value { font: 600 14px 'Segoe UI', Ubuntu, Helvetica, Arial, sans-serif; fill: #1f2328; }
    .rule { stroke: #d8dee4; }
    @media (prefers-color-scheme: dark) {
      .card { fill: #0d1117; stroke: #30363d; }
      .sub, .label { fill: #8d96a0; }
      .value { fill: #e6edf3; }
      .rule { stroke: #21262d; }
    }
  </style>
  <rect class="card" x="0.5" y="0.5" width="479" height="237" rx="10"/>
  <text class="title" x="25" y="34">Most Used Languages</text>
  <text class="sub" x="25" y="52">By bytes of code across 99 repositories</text>
  <clipPath id="bar"><rect x="25" y="66" width="430" height="10" rx="5"/></clipPath>
  <g clip-path="url(#bar)"><rect x="25.00" y="66" width="143.41" height="10" fill="#A97BFF"/><rect x="168.41" y="66" width="113.04" height="10" fill="#3572A5"/><rect x="281.45" y="66" width="65.35" height="10" fill="#3178c6"/><rect x="346.80" y="66" width="38.69" height="10" fill="#dea584"/><rect x="385.49" y="66" width="37.85" height="10" fill="#F05138"/><rect x="423.34" y="66" width="17.25" height="10" fill="#f1e05a"/><rect x="440.59" y="66" width="7.78" height="10" fill="#663399"/><rect x="448.37" y="66" width="6.63" height="10" fill="#e34c26"/></g>
  <circle cx="30" cy="100" r="5" fill="#A97BFF"/><text class="value" x="41" y="104">Kotlin</text><text class="label" x="230" y="104" text-anchor="end">33.4% · 2.6 MB</text><circle cx="255" cy="100" r="5" fill="#3572A5"/><text class="value" x="266" y="104">Python</text><text class="label" x="455" y="104" text-anchor="end">26.3% · 2.1 MB</text><circle cx="30" cy="126" r="5" fill="#3178c6"/><text class="value" x="41" y="130">TypeScript</text><text class="label" x="230" y="130" text-anchor="end">15.2% · 1.2 MB</text><circle cx="255" cy="126" r="5" fill="#dea584"/><text class="value" x="266" y="130">Rust</text><text class="label" x="455" y="130" text-anchor="end">9.0% · 728.1 kB</text><circle cx="30" cy="152" r="5" fill="#F05138"/><text class="value" x="41" y="156">Swift</text><text class="label" x="230" y="156" text-anchor="end">8.8% · 712.4 kB</text><circle cx="255" cy="152" r="5" fill="#f1e05a"/><text class="value" x="266" y="156">JavaScript</text><text class="label" x="455" y="156" text-anchor="end">4.0% · 324.6 kB</text><circle cx="30" cy="178" r="5" fill="#663399"/><text class="value" x="41" y="182">CSS</text><text class="label" x="230" y="182" text-anchor="end">1.8% · 146.4 kB</text><circle cx="255" cy="178" r="5" fill="#e34c26"/><text class="value" x="266" y="182">HTML</text><text class="label" x="455" y="182" text-anchor="end">1.5% · 124.8 kB</text>
