<svg xmlns="http://www.w3.org/2000/svg" width="480" height="238" viewBox="0 0 480 238" role="img" aria-label="Most used languages">
  <style>
    .card { fill: #ffffff; stroke: #d0d7de; }
    .title { font: 600 17px 'Segoe UI', Ubuntu, Helvetica, Arial, sans-serif; fill: #2196F3; }
    .sub { font: 400 12px 'Segoe UI', Ubuntu, Helvetica, Arial, sans-serif; fill: #57606a; }
    .label { font: 400 13px 'Segoe UI', Ubuntu, Helvetica, Arial, sans-serif; fill: #57606a; }
    .value { font: 600 14px 'Segoe UI', Ubuntu, Helvetica, Arial, sans-serif; fill: #1f2328; }
    .rule { stroke: #d8dee4; }
    @media (prefers-color-scheme: dark) {
      .card { fill: #0d1117; stroke: #30363d; }
      .sub, .label { fill: #8d96a0; }
      .value { fill: #e6edf3; }
      .rule { stroke: #21262d; }
    }
  </style>
  <rect class="card" x="0.5" y="0.5" width="479" height="237" rx="10"/>
  <text class="title" x="25" y="34">Most Used Languages</text>
  <text class="sub" x="25" y="52">By bytes of code across 97 repositories</text>
  <clipPath id="bar"><rect x="25" y="66" width="430" height="10" rx="5"/></clipPath>
  <g clip-path="url(#bar)"><rect x="25.00" y="66" width="139.66" height="10" fill="#A97BFF"/><rect x="164.66" y="66" width="137.54" height="10" fill="#3572A5"/><rect x="302.20" y="66" width="74.02" height="10" fill="#3178c6"/><rect x="376.22" y="66" width="35.24" height="10" fill="#F05138"/><rect x="411.46" y="66" width="21.00" height="10" fill="#f1e05a"/><rect x="432.46" y="66" width="8.38" height="10" fill="#e34c26"/><rect x="440.85" y="66" width="8.29" height="10" fill="#dea584"/><rect x="449.13" y="66" width="5.87" height="10" fill="#00B4AB"/></g>
  <circle cx="30" cy="100" r="5" fill="#A97BFF"/><text class="value" x="41" y="104">Kotlin</text><text class="label" x="230" y="104" text-anchor="end">32.5% · 2.1 MB</text><circle cx="255" cy="100" r="5" fill="#3572A5"/><text class="value" x="266" y="104">Python</text><text class="label" x="455" y="104" text-anchor="end">32.0% · 2.1 MB</text><circle cx="30" cy="126" r="5" fill="#3178c6"/><text class="value" x="41" y="130">TypeScript</text><text class="label" x="230" y="130" text-anchor="end">17.2% · 1.1 MB</text><circle cx="255" cy="126" r="5" fill="#F05138"/><text class="value" x="266" y="130">Swift</text><text class="label" x="455" y="130" text-anchor="end">8.2% · 545.2 kB</text><circle cx="30" cy="152" r="5" fill="#f1e05a"/><text class="value" x="41" y="156">JavaScript</text><text class="label" x="230" y="156" text-anchor="end">4.9% · 324.8 kB</text><circle cx="255" cy="152" r="5" fill="#e34c26"/><text class="value" x="266" y="156">HTML</text><text class="label" x="455" y="156" text-anchor="end">1.9% · 129.7 kB</text><circle cx="30" cy="178" r="5" fill="#dea584"/><text class="value" x="41" y="182">Rust</text><text class="label" x="230" y="182" text-anchor="end">1.9% · 128.2 kB</text><circle cx="255" cy="178" r="5" fill="#00B4AB"/><text class="value" x="266" y="182">Dart</text><text class="label" x="455" y="182" text-anchor="end">1.4% · 90.7 kB</text>
